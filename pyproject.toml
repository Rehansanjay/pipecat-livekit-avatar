[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-livekit-avatar"
version = "0.1.0"
description = "Pipecat output for LiveKit avatars (MeshLite and LiveKit Agents avatar workers) that take the bot's voice over LiveKit data streams"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
dependencies = ["pipecat-ai[livekit]>=1.0.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_livekit_avatar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
